<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIFF診断</title>
<style>body{font:14px/1.7 -apple-system,sans-serif;padding:16px;word-break:break-all}pre{white-space:pre-wrap;background:#f2f2f2;padding:10px;border-radius:8px}</style>
</head><body>
<h3>LIFF診断（確認用・お客様には見せません）</h3>
<pre id="o"></pre>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
var ID = '2012831074-StuSecSS', o = document.getElementById('o');
function log(s) { o.textContent += s + '\n'; }
log('開いたURL: ' + location.href);
log('ページ内のLIFF ID: ' + ID);
liff.init({ liffId: ID }).then(function () {
  log('init: 成功');
  log('LINEアプリ内: ' + liff.isInClient() + ' / ログイン済み: ' + liff.isLoggedIn());
  log('liff.id: ' + liff.id);
  try { var c = liff.getContext(); log('LINEが認識したLIFF ID: ' + (c && c.liffId) + ' / type: ' + (c && c.type)); } catch (e) { log('context取得失敗: ' + e); }
}).catch(function (e) {
  log('init: 失敗');
  log('code: ' + e.code);
  log('message: ' + e.message);
  try { log('cause: ' + JSON.stringify(e.cause || null)); } catch (x) {}
});
</script>
</body></html>
