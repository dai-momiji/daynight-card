<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Day&Night ポイントカード</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#f4f3f1;color:#1d1f24;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;line-height:1.55}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px 40px}
[hidden]{display:none!important}
h1{font-size:18px;margin:2px 0 14px;text-align:center;letter-spacing:.06em}
h1 small{display:block;font-size:12px;color:#8a8d94;font-weight:500;letter-spacing:.2em;margin-bottom:2px}
.box{background:#fff;border-radius:18px;padding:18px 16px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:12px}
.box h2{font-size:17px;margin:0 0 6px}
.box p{margin:6px 0;color:#555;font-size:14px}
.choice{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.choice label{display:flex;align-items:center;gap:12px;border:2px solid #e4e4e0;border-radius:14px;padding:14px;font-weight:700;cursor:pointer;font-size:16px}
.choice input{width:20px;height:20px;accent-color:#1d1f24}
.choice label small{display:block;font-weight:500;color:#777;font-size:12px}
.choice label.on{border-color:#1d1f24;background:#fafaf8}
label.f{display:block;font-size:13px;font-weight:700;color:#666;margin:12px 0 4px}
input.t{width:100%;padding:14px;border:1.5px solid #ddd;border-radius:12px;font-size:18px;background:#fff}
input.t:focus{outline:none;border-color:#1d1f24}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;background:#1d1f24;color:#fff;margin-top:14px;cursor:pointer;text-align:center;text-decoration:none}
.btn.sub{background:#fff;color:#06c755;border:2px solid #06c755}
.btn.line{background:#06c755;color:#fff}
.must{background:#fff8e1;border:1.5px solid #f0c64a;border-radius:14px;padding:12px 14px;margin:14px 0 0;font-size:14px;color:#5b4300}.must b{display:block;font-size:16px;color:#3b2a00;margin-bottom:2px}
.btn.gray{background:#e9e8e4;color:#1d1f24}
.btn:disabled{opacity:.4}
.err{color:#c01d2a;font-size:14px;margin-top:10px;min-height:1px}
details{margin-top:14px}summary{font-size:14px;color:#666;cursor:pointer;padding:6px 0}
.banner{border-radius:14px;padding:12px 14px;margin-bottom:12px;font-weight:700;font-size:15px}
.banner.ok{background:#e6f6ec;color:#0b6b3a}.banner.gift{background:#fde8f1;color:#a21c57}.banner.up{background:#fff3d6;color:#7a5200}.banner.plain{background:#eceae6;color:#555}
.banner div+div{margin-top:4px}
/* カード */
.cv{position:relative;width:100%;aspect-ratio:1005/591;border-radius:12px;overflow:hidden;background:#ddd;box-shadow:0 4px 14px rgba(0,0,0,.18);--u:3.5px}
.cv img{position:absolute;inset:0;width:100%;height:100%;display:block}
.cell{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#f6d77a,#e3ac22 70%);color:#3b2a00;font-weight:800;line-height:1.08;text-align:center;box-shadow:0 0 0 calc(var(--u)*.35) rgba(255,255,255,.92);font-size:calc(var(--u)*3.0);border-radius:50%;letter-spacing:-.02em}
.cell.fr{border-radius:22%}
.nm,.nn{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-weight:700;text-align:center}
.info{margin:12px 2px 2px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.info .pt{font-size:22px;font-weight:800}.info .pt small{font-size:13px;color:#777;font-weight:600}
.info .nx{font-size:14px;color:#444}
.res{margin:4px 2px 0;font-size:14px;color:#8a4b00;font-weight:700}
.res .rs2{font-size:12.5px;font-weight:600;margin-top:2px}
.plat{margin-top:12px}
.plat .lbl{font-size:13px;color:#777}.plat .amt{font-size:34px;font-weight:800;letter-spacing:-.01em}.plat .amt small{font-size:14px;color:#888;font-weight:600;margin-left:4px}
.bar{height:10px;background:#ececec;border-radius:6px;overflow:hidden;margin:8px 0 10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#9aa1ab,#5c6470)}
.plat .rem{font-size:20px;font-weight:800}.plat .dl{font-size:16px;font-weight:600;margin-top:2px}.plat .note{font-size:12px;color:#8a8d94;margin-top:8px;line-height:1.6}
.spin{text-align:center;padding:60px 0;color:#888}
/* ===== プラチナの旅の演出（CSSとSVGだけ。画像・動画は使わない） ===== */
#fly{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));background:linear-gradient(175deg,var(--s1),var(--s2));color:#fff;opacity:0;transition:opacity .5s;overflow:hidden;cursor:pointer;-webkit-user-select:none;user-select:none}
#fly.on{opacity:1}
#fly .fx,#fly .dc{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#fly .fx i{position:absolute;display:block;will-change:transform}
#fly .fx i.snow{top:0;width:var(--z);height:var(--z);border-radius:50%;background:#fff;opacity:.85;animation:fall var(--d) linear var(--dl) infinite}
#fly .fx i.petal{top:0;width:calc(var(--z)*1.4);height:var(--z);border-radius:80% 0 80% 0;background:#ffc4d6;opacity:.9;animation:fall var(--d) linear var(--dl) infinite}
#fly .fx i.leafg,#fly .fx i.leafo,#fly .fx i.leafr{top:0;width:calc(var(--z)*1.6);height:calc(var(--z)*.9);border-radius:100% 0 100% 0;animation:fall var(--d) linear var(--dl) infinite}
#fly .fx i.leafg{background:#8fd18a}#fly .fx i.leafo{background:#f2a444}#fly .fx i.leafr{background:#e0583a}
#fly .fx i.rain{top:0;width:1.5px;height:calc(var(--z)*4);background:rgba(255,255,255,.45);animation:rain var(--d) linear var(--dl) infinite}
#fly .fx i.star{width:var(--z);height:var(--z);border-radius:50%;background:#fff;animation:tw var(--d) ease-in-out var(--dl) infinite}
@keyframes fall{from{transform:translate3d(0,-8vh,0) rotate(0)}to{transform:translate3d(var(--dx),108vh,0) rotate(var(--r))}}
@keyframes rain{from{transform:translate3d(0,-10vh,0)}to{transform:translate3d(-30px,108vh,0)}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
#fly .dc.sun:after{content:"";position:absolute;left:50%;bottom:-70px;width:280px;height:280px;margin-left:-140px;border-radius:50%;background:radial-gradient(circle,#ffe39a 0,#ffb347 42%,rgba(255,179,71,0) 70%)}
#fly .dc.moon:after{content:"";position:absolute;right:26px;top:34px;width:60px;height:60px;border-radius:50%;background:#fff4c8;box-shadow:0 0 40px 12px rgba(255,244,200,.4)}
#fly .tr{position:absolute;bottom:max(10px,env(safe-area-inset-bottom));display:block}
#fly .tr svg{display:block;width:100%;height:auto}
#fly .tr.a{left:10px;width:62px}#fly .tr.b{right:12px;width:44px;opacity:.9}
#fly .tr .l1{animation:tw 1.5s ease-in-out infinite}#fly .tr .l2{animation:tw 1.5s ease-in-out .5s infinite}#fly .tr .l3{animation:tw 1.5s ease-in-out 1s infinite}
#fly .bx{position:relative;width:100%;max-width:360px;text-align:center}
#fly .cls{font-size:12px;letter-spacing:.34em;opacity:.85;margin-bottom:6px}
#fly h2{font-size:clamp(17px,5.8vw,22px);margin:0 0 16px;letter-spacing:.04em;line-height:1.35}
#fly .bp{position:relative;border-radius:16px;background:linear-gradient(135deg,#fbf9f4,#d8d4ca 55%,#f3f0e9);color:#1d1f24;padding:13px 16px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35);text-align:left;opacity:0;transform:translateY(24px)}
#fly.on .bp{animation:up .6s .15s ease-out forwards}
@keyframes up{to{opacity:1;transform:none}}
#fly .hd{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.16em;color:#6b6f78;font-weight:700}
#fly .rt{display:flex;align-items:center;margin:10px 0 6px}
#fly .ap{width:78px;flex:none}#fly .ap b{display:block;font-size:34px;line-height:1;letter-spacing:.04em}#fly .ap small{display:block;font-size:12px;color:#555;margin-top:4px;white-space:nowrap}#fly .ap.r{text-align:right}
#fly .pa{position:relative;flex:1;height:36px;margin:0 18px}
#fly .pa:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed #a5a39a}
#fly .pm{position:absolute;left:0;top:50%;width:0;height:0}
#fly .pl{position:absolute;left:-13px;top:-13px;width:26px;height:26px;fill:#1d1f24;transform:rotate(90deg)}
#fly .go .pm{animation:fly 1.15s .35s ease-in-out forwards}
#fly .go .pl{animation:arc 1.15s .35s ease-in-out forwards}
@keyframes fly{to{transform:translateX(var(--w))}}
@keyframes arc{0%{transform:translateY(0) rotate(68deg)}50%{transform:translateY(-12px) rotate(90deg)}100%{transform:translateY(0) rotate(112deg)}}
#fly .ft{font-size:12px;color:#555;font-weight:700;margin-top:2px}
#fly .st{position:absolute;right:10px;bottom:-34px;width:74px;height:74px;border-radius:50%;border:3px double #c2362b;color:#c2362b;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1.25;text-align:center;white-space:nowrap;background:rgba(255,246,240,.9);opacity:0;transform:rotate(-14deg) scale(2.2)}
#fly .st span{font-size:var(--sf,14px)}#fly .st small{font-size:10px;letter-spacing:.04em}
#fly .go .st{animation:stamp .35s 1.55s cubic-bezier(.2,1.4,.4,1) forwards}
#fly .stay .pa,#fly .stay .ap.r{display:none}#fly .stay .ap{width:auto}#fly .stay.go .st{animation-delay:.5s}
@keyframes stamp{to{opacity:.95;transform:rotate(-14deg) scale(1)}}
#fly .msg{margin-top:46px;font-size:16px;font-weight:700;line-height:1.55;text-wrap:balance;opacity:0;transition:opacity .5s}
#fly .sb{margin-top:8px;text-wrap:balance;font-size:13px;opacity:0;transition:opacity .5s .15s;line-height:1.6;color:rgba(255,255,255,.88)}
#fly .msg.in{opacity:1}#fly .sb.in{opacity:1}
#fly .sk{margin-top:18px;border:1.5px solid rgba(255,255,255,.7);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:9px 24px;font-size:14px;font-weight:700;opacity:0;transition:opacity .5s;cursor:pointer}
#fly .sk.in{opacity:1}
@media (prefers-reduced-motion:reduce){#fly{transition:none}#fly .fx{display:none}#fly .bp{opacity:1;transform:none;animation:none!important}#fly .go .pm{animation:none;transform:translateX(var(--w))}#fly .go .pl{animation:none;transform:rotate(90deg)}#fly .go .st{animation:none;opacity:.95;transform:rotate(-14deg)}#fly .tr *{animation:none!important}#fly .msg,#fly .sb,#fly .sk{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1><small>Day&amp;Night</small><span id="ttl">ポイントカード</span></h1>

  <div id="loading" class="spin">読み込み中…</div>

  <!-- 初回：名前と、新規／紙カード -->
  <div id="landing" hidden>
    <div class="box">
      <h2>はじめまして</h2>
      <p>お客様カルテをつくります。当てはまる方を選んでお名前を入力してください。</p>
      <div class="choice" id="choice">
        <label><input type="radio" name="kind" value="new"><span>はじめてのご来店<small>これから新しくつくります</small></span></label>
        <label><input type="radio" name="kind" value="paper"><span>紙のポイントカードをお持ちの方<small>いまのポイントを引き継ぎます</small></span></label>
      </div>
      <label class="f" for="nm">お名前（フルネーム）</label>
      <input id="nm" class="t" placeholder="例 山田 花子" autocomplete="name">
      <button id="go" class="btn">つづける</button>
      <div id="landErr" class="err"></div>
    </div>
    <details class="box" id="codeBox">
      <summary>連携コードを発行してもらった方はこちら</summary>
      <label class="f" for="code">連携コード</label>
      <input id="code" class="t" inputmode="numeric" placeholder="6けたの数字" autocomplete="off">
      <button id="codeGo" class="btn gray">つなぐ</button>
      <div id="codeErr" class="err"></div>
    </details>
  </div>

  <!-- 確認待ち -->
  <div id="pend" hidden>
    <div class="box">
      <h2>ありがとうございます</h2>
      <p id="pendTxt">スタッフが確認しています。そのままお待ちください。</p>
      <div class="must"><b>公式LINEにお名前を送ってください</b>下のボタンを押すとトーク画面が開きます。お名前が入力されているので、そのまま送信してください。</div>
      <a id="pendOa" class="btn line" href="#">公式LINEにお名前を送る</a>
      <p style="font-size:13px;color:#888;margin:14px 0 0">スタッフの確認が終わると、この画面にカードが出ます。</p>
      <button id="pendRe" class="btn gray">更新する</button>
    </div>
  </div>

  <!-- カード -->
  <div id="card" hidden>
    <div id="banner"></div>
    <div class="cv" id="cv"><img id="cimg" alt=""><div id="ov"></div></div>
    <div class="info"><span class="pt" id="pt"></span><span class="nx" id="nx"></span></div>
    <div class="res" id="res"></div>
    <div class="box plat" id="plat" hidden></div>
    <a id="oaBtn" class="btn sub" href="https://line.me/R/ti/p/@333fguor">公式LINEのトークを開く</a>
  </div>

  <div id="errBox" class="box" hidden><h2>うまく開けませんでした</h2><p id="errTxt"></p><button id="retry" class="btn">もう一度ひらく</button></div>
</div>

<script>
(function () {
'use strict';
/* ===== 設定（URLは入れてあります。デプロイを作り直してURLが変わった時だけ書き換える） ===== */
var EXEC_URL = 'https://script.google.com/macros/s/AKfycbxAcMc2iwDj_PDVk_sZ0Hq-5K4UVwXz-KH182nEv2Bd_ilm1M1s86tWWtwBGli8vsDnAA/exec';
var LIFF_ID = '2012622591-ByCxeAxO';
var OA_URL = 'https://line.me/R/ti/p/@333fguor', OA_ID = '@333fguor';
var IMG_VER = '6';
/* ============================================================= */

/* カードの絵ごとの「丸の位置」: [中心x%, 中心y%, 幅%, 高さ%, 枠(プレゼント)か] — 左上のポイントから順番 */
var C = function (x, y, w, h) { return [x, y, w, h, 0]; }, F = function (x, y, w, h) { return [x, y, w, h, 1]; };
var GEO = {
  'エコノミー': { img: 'card_eco.png', ar: '1005/591', ty: 90.3, tc: '#111', n: [9.6, 52], o: [68.6, 88.4], s: [
    C(37.35, 22.18, 11.34, 19.28), C(49.03, 22.17, 11.34, 19.28), C(60.18, 22.17, 11.34, 19.29), C(71.94, 22.17, 11.34, 19.28), F(84.63, 22.08, 9.63, 16.38),
    C(37.35, 43.75, 11.35, 19.31), C(49.03, 43.75, 11.36, 19.32), C(60.19, 43.75, 11.35, 19.31), C(71.94, 43.76, 11.34, 19.28), F(84.53, 43.57, 9.63, 16.38)] },
  'ビジネス': { img: 'card_biz.png', ar: '1005/591', ty: 90.3, tc: '#111', n: [9.6, 52], o: [68.6, 88.4], s: [
    C(37.35, 22.17, 11.36, 19.32), C(49.03, 22.17, 11.36, 19.32), C(60.19, 22.18, 11.37, 19.33), C(71.94, 22.16, 11.35, 19.3), C(82.97, 22.4, 11.37, 19.34),
    C(37.35, 43.74, 11.37, 19.33), C(49.02, 43.75, 11.37, 19.34), C(60.18, 43.74, 11.35, 19.31), C(71.92, 43.75, 11.36, 19.31), F(84.58, 43.65, 9.55, 16.51)] },
  'ファースト': { img: 'card_first.png', ar: '1005/591', ty: 90.3, tc: '#111', n: [9.9, 54], o: [71, 88.1], s: [
    C(39.56, 16.3, 12.14, 20.65), C(51.44, 16.29, 12.14, 20.64), C(63.97, 16.29, 12.14, 20.64), C(75.89, 16.55, 12.15, 20.66), C(88.45, 17.27, 12.14, 20.64),
    C(39.56, 39.29, 12.15, 20.66), C(51.45, 39.29, 12.14, 20.64), C(63.96, 39.28, 12.14, 20.64), C(75.89, 39.93, 12.13, 20.63), F(88.61, 40.36, 10.35, 18)] },
  'プラチナ': { img: 'card_platinum.png', ar: '1005/591', ty: 86.9, tc: '#f4f4f4', n: [9.7, 47.6], o: [66.6, 91.8], s: [
    C(31.28, 19.61, 10.72, 18.23), C(43.19, 19.62, 10.71, 18.21), C(55.07, 19.62, 10.69, 18.18), C(66.97, 19.62, 10.7, 18.2), C(78.85, 19.62, 10.68, 18.16), C(90.75, 19.62, 10.71, 18.21),
    C(31.35, 39.79, 10.71, 18.22), C(43.25, 39.8, 10.69, 18.17), C(55.13, 39.81, 10.69, 18.17), C(67.03, 39.8, 10.67, 18.15), C(78.91, 39.81, 10.69, 18.18), F(91.19, 40.1, 9.63, 16.24)] }
};
var NEXT = { 'エコノミー': 'ビジネス', 'ビジネス': 'ファースト', 'ファースト': 'プラチナ', 'プラチナ': 'プラチナ' };

var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function jp(d) { var m = String(d || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[1] + '年' + (+m[2]) + '月' + (+m[3]) + '日' : ''; }
function jpw(d) { var m = String(d || '').match(/^(\d{4})-(\d{2})-(\d{2})/); if (!m) return ''; var w = '日月火水木金土'.charAt(new Date(+m[1], +m[2] - 1, +m[3]).getDay()); return (+m[1] === new Date().getFullYear() ? '' : m[1] + '年') + (+m[2]) + '月' + (+m[3]) + '日（' + w + '）'; }
function ymdNow() { var n = new Date(); return n.getFullYear() + '-' + ('0' + (n.getMonth() + 1)).slice(-2) + '-' + ('0' + n.getDate()).slice(-2); }
function yen(n) { return '¥' + Number(n || 0).toLocaleString('ja-JP'); }
function show(id) {
  ['loading', 'landing', 'pend', 'card', 'errBox'].forEach(function (x) { $(x).hidden = x !== id; });
  var ttl = id === 'landing' ? 'お客様カルテ' : 'ポイントカード';       // 名前を入れる最初の画面だけ「お客様カルテ」
  $('ttl').textContent = ttl; document.title = 'Day&Night ' + ttl;
}
var qs = new URLSearchParams(location.search);
var KEY = qs.get('e') || '', STORE = qs.get('s') || '';
// LIFFのURLに付けた値は、ログイン後に liff.state に入ることがある
try { var ls = qs.get('liff.state'); if (ls && !KEY) { var q2 = new URLSearchParams(ls.replace(/^\/?\??/, '')); KEY = q2.get('e') || ''; STORE = q2.get('s') || STORE; } } catch (e) { }
var TOKEN = '', STATE = null, poller = null, LAST = null;

function call(payload) {
  payload.idToken = TOKEN;
  return fetch(EXEC_URL, { method: 'POST', body: JSON.stringify(payload) }).then(function (r) { return r.json(); }).then(function (j) { if (j.error) throw new Error(j.error); return j; });
}
function fail(msg) { show('errBox'); $('errTxt').textContent = msg; }

/* ---------- 起動 ---------- */
function boot() {
  show('loading');
  liff.init({ liffId: LIFF_ID }).then(function () {
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    TOKEN = liff.getIDToken();
    if (!TOKEN) { liff.login({ redirectUri: location.href }); return; }
    return KEY ? call({ action: 'entry', key: KEY, store: STORE }) : call({ action: 'card' });
  }).then(function (r) { if (r) apply(r); }).catch(function (e) { fail(e.message || String(e)); });
}
$('retry').onclick = boot;

function apply(r, fromPoll) {
  STATE = r.state; clearInterval(poller);
  if (r.state === 'linked') { drawCard(r, fromPoll); show('card'); tripCheck(r); }
  else if (r.state === 'pending') {
    show('pend'); var nm = r.name || ''; $('pendTxt').textContent = (nm ? nm + ' 様、' : '') + 'お名前を受け付けました。';
    $('pendOa').href = 'https://line.me/R/oaMessage/' + OA_ID + '/?' + encodeURIComponent('お名前：' + nm);
    poller = setInterval(function () { call({ action: 'card' }).then(function (x) { if (x.state === 'linked') { x.justRegistered = true; apply(x, true); } }).catch(function () { }); }, 5000);
  } else { show('landing'); }
}
document.addEventListener('visibilitychange', function () { if (!document.hidden && TOKEN && STATE === 'linked') call({ action: 'card' }).then(function (r) { if (r.state === 'linked') { drawCard(r, true); tripCheck(r); } }).catch(function () { }); });
