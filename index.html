<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Day&Night ポイントカード</title>
<style>body{font-family:sans-serif;max-width:460px;margin:auto;padding:14px;background:#f4f4f4}input,button{font-size:20px;padding:12px;width:100%;box-sizing:border-box;margin:6px 0}button{background:#06c755;color:#fff;border:0;border-radius:8px}
.card{border-radius:14px;padding:12px 14px;color:#fff;margin:10px 0}.top{display:flex;justify-content:space-between;font-size:13px;letter-spacing:1px}.top i{color:#f5c542;font-style:normal}
.g{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0}.c{aspect-ratio:1;border-radius:50%;background:#fff;color:#aaa;display:flex;align-items:center;justify-content:center;font-size:13px;text-align:center;line-height:1.15}
.c.k{border-radius:28%;color:#d4a017;font-size:20px;line-height:1}.c.on{background:radial-gradient(circle at 35% 30%,#ffe9a0,#d4a017);color:#4a3000}.yy,.dd{font-size:13px;font-weight:bold;line-height:1.25}
.m{background:#fff3cd;padding:10px;border-radius:8px;margin:8px 0;font-size:14px}.e{color:#c00}small{color:#666}</style></head><body>
<div id="app">読み込み中…</div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const LIFF_ID='2012622591-ByCxeAxO',API='https://script.google.com/macros/s/AKfycbxAcMc2iwDj_PDVk_sZ0Hq-5K4UVwXz-KH182nEv2Bd_ilm1M1s86tWWtwBGli8vsDnAA/exec';
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
col={'エコノミー':'#d32f2f','ビジネス':'#1a3fbf','ファースト':'#111'},en={'エコノミー':'ECONOMY CLASS','ビジネス':'BUSINESS CLASS','ファースト':'FIRST CLASS'},cr={'エコノミー':1,'ビジネス':2,'ファースト':3},
md=d=>d?(+d.slice(5,7))+'/'+(+d.slice(8,10)):'';
const call=async b=>{const r=await fetch(API,{method:'POST',body:JSON.stringify({...b,idToken:liff.getIDToken()})});return r.json()};
async function main(){try{await liff.init({liffId:LIFF_ID});if(!liff.isLoggedIn()){liff.login();return}
 if(!liff.getIDToken())throw new Error('LINEの情報を取得できませんでした');handle(await call({action:'card'}))}catch(e){$('app').innerHTML='<p class=e>'+esc(e.message)+'</p>'}}
function handle(r){if(r.error){$('app').innerHTML='<p class=e>'+esc(r.error)+'</p>'+(r.needLink?'':'<button onclick="location.reload()">もう一度</button>');return}
 if(r.needLink){linkForm();return}render(r.card)}
function linkForm(m){$('app').innerHTML=`<h3>ポイントカードを連携</h3><p>お会計時にスタッフがお渡しする6桁のコードを入力してください。</p>
 <input id=cd inputmode=numeric maxlength=6 placeholder="000000"><button onclick="link()">連携する</button><div id=er class=e>${m||''}</div>
 <small>LINEのアカウントと会員番号を紐づけます。ポイントの表示だけに使います。</small>`}
async function link(){try{const r=await call({action:'link',code:$('cd').value});if(r.error){$('er').textContent=r.error;return}render(r.card)}catch(e){$('er').textContent='通信に失敗しました。もう一度お試しください'}}
function render(r){const eco=r.rank==='エコノミー',dt=r.dates||[],cells=[];
 for(let i=1;i<=r.need;i++){const k=(eco&&i%5==0)||i==r.need,on=i<=r.pt,d=dt[i-1]||'';
  cells.push('<div class="c'+(k?' k':'')+(on?' on':'')+'"><span>'+(on?(d?'<span class=yy>'+d.slice(0,4)+'</span><br><span class=dd>'+md(d)+'</span>':''):(k?'♛':i))+'</span></div>')}
 $('app').innerHTML=`<div class=card style="background:${col[r.rank]}"><div class=top><span><i>${'♛'.repeat(cr[r.rank])}</i> ${en[r.rank]}</span><span>No.${esc(r.no)}</span></div>
 <div class=g>${cells.join('')}</div><b>${esc(r.name)}</b> 様　${r.pt} / ${r.need}pt<br>あと${Math.max(r.need-r.pt,0)}pt で${r.rank==='ファースト'?'継続':'ランクアップ'}${r.expire?'<br>期限 '+r.expire:''}</div>
 ${r.willDouble?'<div class=m>次回予約あり。'+esc(r.reserve)+'までのご来店でポイント2倍</div>':''}
 ${r.benefit?'<div class=m>'+esc(r.rank)+'特典：'+esc(r.benefit)+'</div>':''}${r.nextBenefit?'<div class=m>ファーストになると：'+esc(r.nextBenefit)+'</div>':''}`}
main();
</script></body></html>
